syntax = "proto3";

package inventory;

option java_multiple_files = true;
option java_package = "com.market_place.proto.inventory";

service InventoryService {
  rpc CheckAvailability (StockCheckRequest) returns (StockCheckResponse);
}

message ProductQuantity {
  string product_id = 1;
  int32 quantity = 2;
}

message StockCheckRequest {
  repeated ProductQuantity items = 1;
}

message ProductAvailability {
  string product_id = 1;
  bool available = 2;
}

message StockCheckResponse {
  repeated ProductAvailability results = 1;
}
